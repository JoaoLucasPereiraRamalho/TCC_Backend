# Ambiente local: PostgreSQL e armazenamento S3-compatível (MinIO).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: fittrack
      POSTGRES_DB: fittrack
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fittrack -d fittrack']
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: fittrack
      MINIO_ROOT_PASSWORD: fittrack-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  storage-data:
